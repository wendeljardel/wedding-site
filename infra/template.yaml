AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wedding site backend (HTTP API + Lambdas + DynamoDB)

Parameters:
  AdminToken:
    Type: String
    NoEcho: true
    Description: Token secreto usado no header X-Admin-Token para acessar endpoints admin
    MinLength: 16
  CorsOrigin:
    Type: String
    Default: '*'
    Description: Origem permitida no CORS. Em producao, coloque https://seu-dominio.com.br

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 5
    MemorySize: 256
    Architectures: [arm64]
    Environment:
      Variables:
        GIFTS_TABLE: !Ref GiftsTable
        HONEYMOON_TABLE: !Ref HoneymoonTable
        CORS_ORIGIN: !Ref CorsOrigin

Resources:
  GiftsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wedding-gifts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: giftId
          AttributeType: S
      KeySchema:
        - AttributeName: giftId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  HoneymoonTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wedding-honeymoon-claims
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: claimId
          AttributeType: S
      KeySchema:
        - AttributeName: claimId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsOrigin
        AllowHeaders:
          - Content-Type
          - X-Admin-Token
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS

  ListGiftsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: listGifts.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GiftsTable
      Events:
        ListGifts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/gifts
            Method: GET

  ClaimGiftFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: claimGift.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GiftsTable
      Events:
        Claim:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/gifts/{giftId}/claim
            Method: POST

  AdminListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: adminGifts.list
      Environment:
        Variables:
          ADMIN_TOKEN: !Ref AdminToken
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GiftsTable
      Events:
        AdminList:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/admin/gifts
            Method: GET

  AdminReleaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: adminGifts.release
      Environment:
        Variables:
          ADMIN_TOKEN: !Ref AdminToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GiftsTable
      Events:
        AdminRelease:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/admin/gifts/{giftId}/release
            Method: POST

  ClaimHoneymoonFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: claimHoneymoon.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HoneymoonTable
      Events:
        Claim:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/honeymoon/claim
            Method: POST

  AdminHoneymoonListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: adminHoneymoon.list
      Environment:
        Variables:
          ADMIN_TOKEN: !Ref AdminToken
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HoneymoonTable
      Events:
        AdminList:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/admin/honeymoon
            Method: GET

  AdminHoneymoonConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: adminHoneymoon.confirm
      Environment:
        Variables:
          ADMIN_TOKEN: !Ref AdminToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HoneymoonTable
      Events:
        AdminConfirm:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/admin/honeymoon/{claimId}/confirm
            Method: POST

  AdminHoneymoonDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: adminHoneymoon.remove
      Environment:
        Variables:
          ADMIN_TOKEN: !Ref AdminToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HoneymoonTable
      Events:
        AdminDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/admin/honeymoon/{claimId}
            Method: DELETE

Outputs:
  ApiUrl:
    Description: URL base da API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  GiftsTableName:
    Description: Nome da tabela DynamoDB de presentes
    Value: !Ref GiftsTable
  HoneymoonTableName:
    Description: Nome da tabela DynamoDB de contribuicoes da lua de mel
    Value: !Ref HoneymoonTable
